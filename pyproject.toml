[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-circuit-optimiser"
version = "0.1.0"
description = "Source-bound staged search for reversible point-addition circuits"
requires-python = ">=3.10"
dependencies = []
license = {file = "LICENSE"}

[project.scripts]
lco = "llm_circuit_optimiser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
