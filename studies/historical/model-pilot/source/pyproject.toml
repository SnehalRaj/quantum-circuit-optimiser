[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reversible-circuit-optimizer"
version = "0.1.0"
description = "Reproducible circuit search with typed recipes, independent audits, and model usage records"
requires-python = ">=3.11"
dependencies = ["scipy>=1.11"]

[project.optional-dependencies]
profiling = ["tiktoken>=0.7"]
study = ["matplotlib>=3.7"]
openevolve = ["openevolve @ git+https://github.com/algorithmicsuperintelligence/openevolve.git@04a37f191b2eb367daef455057a0470c0ac853d8"]

[project.scripts]
circuit-opt = "circuitopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
circuitopt = ["data/tokenizer/*", "data/rules/*.json", "data/rules/evidence/*.json", "data/dashboard.html", "data/calibration/*.json", "data/grammars/*.json", "data/levers/*.json"]
