<text x="86" y="173" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#556b79" font-weight="400" text-anchor="start">Source code and research notes</text>
<rect x="564" y="69" width="464" height="119" rx="12" fill="white" stroke="#23759a" stroke-width="1.8"/>
<text x="586" y="109" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#193343" font-weight="700" text-anchor="start">Benchmark creation</text>
<text x="586" y="145" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#556b79" font-weight="400" text-anchor="start">16-bit point addition</text>
<text x="586" y="173" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#556b79" font-weight="400" text-anchor="start">Full secp256k1 point addition</text>
