<svg xmlns="http://www.w3.org/2000/svg"
      xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
      width="180mm" height="96mm" viewBox="0 0 1600 854">
      <title>Setup, fast search loop, and submission phase</title>
      <desc>Setup collects GitHub commits and messages, creates point-addition
      benchmarks, and creates a typed grammar. The fast loop selects parents,
      proposes edits, checks circuits, and promotes candidates. The submission phase
      validates full point addition and submits qualified circuits.</desc>
      <defs>
<marker id="arrow-gray" markerWidth="10" markerHeight="10"
          refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M 0 0 L 9 5 L 0 10 Z" fill="#556b79"/></marker>
<marker id="arrow-blue" markerWidth="10" markerHeight="10"
          refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M 0 0 L 9 5 L 0 10 Z" fill="#23759a"/></marker>
<marker id="arrow-teal" markerWidth="10" markerHeight="10"
          refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M 0 0 L 9 5 L 0 10 Z" fill="#167d73"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="10"
          refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M 0 0 L 9 5 L 0 10 Z" fill="#8060a2"/></marker>
</defs>
<rect width="1600" height="854" fill="white"/>
