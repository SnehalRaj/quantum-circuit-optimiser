<path d="M 1232 421 V 465" fill="none" stroke="#23759a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)" />
<path d="M 990 525 H 618" fill="none" stroke="#23759a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)" />
<path d="M 126 525 H 86 V 369 H 118" fill="none" stroke="#23759a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)" />
<text x="800" y="452" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#23759a" font-weight="400" text-anchor="middle">Repeat the search</text>
<path d="M 296 189 V 230 H 368 V 309" fill="none" stroke="#556b79" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-gray)" />
