<text x="1086" y="145" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#556b79" font-weight="400" text-anchor="start">Arithmetic edits</text>
<text x="1086" y="173" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#556b79" font-weight="400" text-anchor="start">Conditions for each edit</text>
