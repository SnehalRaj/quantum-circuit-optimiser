<path d="M 368 577 V 715" fill="none" stroke="#167d73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)" />
<rect x="64" y="722" width="698" height="94" rx="12" fill="white" stroke="#167d73" stroke-width="1.8"/>
<text x="86" y="762" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#193343" font-weight="700" text-anchor="start">Run and validate</text>
<text x="86" y="798" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#556b79" font-weight="400" text-anchor="start">Full point-addition benchmarks</text>
<rect x="838" y="722" width="698" height="94" rx="12" fill="white" stroke="#167d73" stroke-width="1.8"/>
<text x="860" y="762" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#193343" font-weight="700" text-anchor="start">Submit to leaderboard</text>
<text x="860" y="798" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#556b79" font-weight="400" text-anchor="start">Validated circuits</text>
<path d="M 764 769 H 828" fill="none" stroke="#167d73" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)" />
</svg>
